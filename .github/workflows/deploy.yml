name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/, but a custom domain serves from
      # the root. Adding public/CNAME is what switches the site over, so derive
      # the base path from that rather than hard-coding it.
      - name: Work out the base path
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            echo "Custom domain found ($(cat public/CNAME)) — building for the domain root."
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
            echo "No CNAME — building for /${{ github.event.repository.name }}/."
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
        run: npm run build

      - name: Fail early if Supabase secrets are missing
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::No Supabase URL found in the bundle. Add the repository secrets"
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under"
            echo "::error::Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
